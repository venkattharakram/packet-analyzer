<!DOCTYPE html>
<html>
<head>
    <title>Packet Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4 text-center">📡 Packet Analyzer</h2>

    <!-- Sniffing Controls -->
    <div class="d-flex justify-content-center mb-3">
        <button class="btn btn-success me-2" onclick="startSniffing()">Start Sniffing</button>
        <button class="btn btn-danger me-2" onclick="stopSniffing()">Stop Sniffing</button>
        <button class="btn btn-secondary" onclick="refreshAll()">🔄 Refresh</button>
        <span id="sniff-status" class="ms-3 fw-bold text-primary"></span>
    </div>

    <!-- Filters -->
    <div class="d-flex justify-content-center mb-4">
        <select id="protocol-filter" class="form-select w-auto me-2" onchange="refreshPackets()">
            <option value="">All Protocols</option>
        </select>
        <select id="source-filter" class="form-select w-auto me-2" onchange="refreshPackets()">
            <option value="">All Sources</option>
            <option value="LIVE">LIVE</option>
            <option value="PCAP">PCAP</option>
        </select>
    </div>

    <div class="row">
        <!-- Protocol Summary -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Protocol Summary</h5>
                    <div style="height:220px;">
                        <canvas id="protocolChart"></canvas>
                    </div>
                    <ul id="protocol-list" class="mt-3 small"></ul>
                </div>
            </div>
        </div>

        <!-- Packets Table -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Packets</h5>
                    <div class="table-responsive" style="max-height:500px; overflow-y:auto;">
                        <table class="table table-striped table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Source IP</th>
                                    <th>Dest IP</th>
                                    <th>Protocol</th>
                                    <th>Summary</th>
                                    <th>Timestamp (UTC)</th>
                                    <th>Timestamp (IST)</th>
                                    <th>Source</th>
                                </tr>
                            </thead>
                            <tbody id="packet-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function startSniffing() {
    fetch("/api/start_sniffing", { method: "POST" })
        .then(res => res.json())
        .then(() => {
            document.getElementById("sniff-status").innerText = "✅ Sniffing Started";
        })
        .catch(() => {
            document.getElementById("sniff-status").innerText = "❌ Error starting sniffing";
        });
}

function stopSniffing() {
    fetch("/api/stop_sniffing", { method: "POST" })
        .then(res => res.json())
        .then(() => {
            document.getElementById("sniff-status").innerText = "🛑 Sniffing Stopped";
        })
        .catch(() => {
            document.getElementById("sniff-status").innerText = "❌ Error stopping sniffing";
        });
}

// ---- Chart + Protocol List ----
let protocolChart;
function loadProtocolSummary() {
    fetch("/api/summary")
        .then(res => res.json())
        .then(summary => {
            const labels = Object.keys(summary);
            const data = labels.map(k => Object.values(summary[k]).reduce((a,b) => a+b, 0));

            // update dropdown
            const dropdown = document.getElementById("protocol-filter");
            dropdown.innerHTML = '<option value="">All Protocols</option>';
            labels.forEach(proto => {
                dropdown.innerHTML += `<option value="${proto}">${proto}</option>`;
            });

            // update chart
            if (protocolChart) {
                protocolChart.destroy();
            }
            const ctx = document.getElementById("protocolChart").getContext("2d");
            protocolChart = new Chart(ctx, {
                type: "doughnut",
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ["#007bff","#28a745","#dc3545","#ffc107","#17a2b8","#6f42c1"]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: "bottom" } }
                }
            });

            // update protocol list
            const list = document.getElementById("protocol-list");
            list.innerHTML = "";
            for (const proto in summary) {
                const counts = summary[proto];
                let text = `${proto}: `;
                text += Object.entries(counts).map(([src,c]) => `${src}=${c}`).join(", ");
                list.innerHTML += `<li>${text}</li>`;
            }
        });
}

// ---- Packets Table ----
function refreshPackets() {
    const protocol = document.getElementById("protocol-filter").value;
    const source = document.getElementById("source-filter").value;

    let url = "/api/packets";
    if (protocol) {
        url = `/api/filter?protocol=${protocol}`;
    }

    let params = {};
    if (source) {
        params["source"] = source;
    }

    fetch(url + (source ? `&source=${source}` : ""))
        .then(res => res.json())
        .then(data => {
            const packets = data.packets || data;
            const tbody = document.getElementById("packet-table");
            tbody.innerHTML = "";
            packets.forEach(p => {
                const row = `<tr>
                    <td>${p.id}</td>
                    <td>${p.src_ip}</td>
                    <td>${p.dst_ip}</td>
                    <td>${p.protocol}</td>
                    <td>${p.summary}</td>
                    <td>${p.timestamp}</td>
                    <td>${p.timestamp}</td>
                    <td>${p.source}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });
}

function refreshAll() {
    loadProtocolSummary();
    refreshPackets();
}

// auto refresh every 2 sec
setInterval(refreshAll, 2000);
</script>

</body>
</html>

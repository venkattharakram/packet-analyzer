<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📡 Packet Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
  <h2 class="mb-4 text-center">📡 Packet Analyzer Dashboard</h2>

  <!-- Sniffing Controls -->
  <div class="d-flex justify-content-center mb-4">
    <button class="btn btn-success me-2" onclick="startSniffing()">▶️ Start Sniffing</button>
    <button class="btn btn-danger me-2" onclick="stopSniffing()">⏹ Stop Sniffing</button>
    <span id="sniff-status" class="fw-bold text-primary"></span>
  </div>

  <!-- Filters -->
  <div class="text-center mb-4">
    <a href="/" class="btn btn-dark btn-sm">All Packets</a>
    <a href="/?source=LIVE" class="btn btn-danger btn-sm">LIVE</a>
    <a href="/?source=PCAP" class="btn btn-primary btn-sm">PCAP</a>
  </div>

  <!-- Protocol Summary + Chart -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title d-flex justify-content-between">
            Protocol Summary
            <button class="btn btn-outline-secondary btn-sm" onclick="refreshSummary()">🔄 Refresh</button>
          </h5>
          <ul id="protocol-summary" class="list-unstyled"></ul>
          <a href="/api/all_protocols" class="btn btn-link">View All Protocols</a>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Traffic Distribution</h5>
          <canvas id="protocolChart" height="180"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Packets Table -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title">Captured Packets</h5>
      <div class="table-responsive">
        <table id="packetTable" class="table table-striped table-bordered table-sm">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Source IP</th>
              <th>Destination IP</th>
              <th>Protocol</th>
              <th>Summary</th>
              <th>Timestamp (UTC)</th>
              <th>Timestamp (IST)</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let chart;
let dataTable;

// --- Sniffing Controls ---
function startSniffing() {
  fetch("/api/start_sniffing", { method: "POST" })
    .then(res => res.json())
    .then(() => { document.getElementById("sniff-status").innerText = "✅ Sniffing Started"; })
    .catch(() => { document.getElementById("sniff-status").innerText = "❌ Error starting sniffing"; });
}

function stopSniffing() {
  fetch("/api/stop_sniffing", { method: "POST" })
    .then(res => res.json())
    .then(() => { document.getElementById("sniff-status").innerText = "🛑 Sniffing Stopped"; })
    .catch(() => { document.getElementById("sniff-status").innerText = "❌ Error stopping sniffing"; });
}

// --- Protocol Summary + Chart ---
function refreshSummary() {
  fetch("/api/summary")
    .then(res => res.json())
    .then(data => {
      let ul = document.getElementById("protocol-summary");
      ul.innerHTML = "";
      let labels = [], values = [];
      let colors = ["#6f42c1","#198754","#0d6efd","#dc3545","#ffc107","#20c997","#6610f2"];

      for (const [proto, counts] of Object.entries(data)) {
        let li = document.createElement("li");
        let a = document.createElement("a");
        a.href = "/?protocol=" + proto;
        a.innerText = proto;
        li.appendChild(a);

        for (const [src, count] of Object.entries(counts)) {
          li.innerHTML += ` (${src}=${count})`;
          values.push(count);
          labels.push(proto);
        }
        ul.appendChild(li);
      }

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("protocolChart"), {
        type: "doughnut",
        data: { labels, datasets: [{ data: values, backgroundColor: colors }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: "bottom" } } }
      });
    });
}

// --- Refresh Packet Table ---
function refreshPackets() {
  fetch("/api/packets")
    .then(res => res.json())
    .then(data => {
      if (!dataTable) {
        // Initialize once
        dataTable = $('#packetTable').DataTable({ pageLength: 25 });
      }
      // Clear and refill rows
      dataTable.clear();
      data.packets.forEach(p => {
        let utc = p.timestamp;
        let ist = convertToIST(utc);
        dataTable.row.add([
          p.id,
          p.src_ip,
          p.dst_ip,
          `<span class="badge bg-secondary">${p.protocol}</span>`,
          p.summary,
          utc,
          ist,
          p.source
        ]);
      });
      dataTable.draw(false); // ✅ redraw without reset
    });
}

// --- IST Conversion ---
function convertToIST(utcTime) {
  if (!utcTime) return "";
  try {
    let utcDate = new Date(utcTime + "Z");
    let istDate = new Date(utcDate.getTime() + (5.5 * 60 * 60 * 1000));
    return istDate.toLocaleString("en-IN", { hour12: true });
  } catch {
    return "Invalid";
  }
}

// --- Auto Refresh ---
setInterval(refreshSummary, 2000);
setInterval(refreshPackets, 2000);

// --- Init ---
$(document).ready(function() {
  refreshSummary();
  refreshPackets();
});
</script>

</body>
</html>

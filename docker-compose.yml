version: "3.8"

services:
  db:
    image: postgres:14
    container_name: packet-db
    restart: always
    environment:
      POSTGRES_DB: packetdb
      POSTGRES_USER: packetuser
      POSTGRES_PASSWORD: packetpass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - packet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packetuser"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@packet.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - ./pgadmin_config:/pgadmin4/servers
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - packet-net

  capture-service:
    build: ./capture-service
    container_name: capture-service
    network_mode: "host"   # ✅ capture host traffic
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PARSER_URL=http://172.31.91.156:5001/parse
      - IFACE=ens5
    extra_hosts:   # 👈 add hostnames that point to localhost
      - "parser-service:127.0.0.1"
      - "analyzer-service:127.0.0.1"
      - "ui-service:127.0.0.1"
      - "persistor-service:127.0.0.1"
    restart: always


  persistor-service:
    build: ./persistor-service
    container_name: persistor-service
    environment:
      SERVICE_PORT: 5002
      DATABASE_URL: "postgresql://packetuser:packetpass@db:5432/packetdb"
    ports:
      - "5002:5002"
    networks:
      - packet-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; exit(0) if urllib.request.urlopen(\"http://localhost:5002/health\").read().decode() == \"OK\" else exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  parser-service:
    build: ./parser-service
    container_name: parser-service
    environment:
      SERVICE_PORT: 5001
      DATABASE_URL: "postgresql://packetuser:packetpass@db:5432/packetdb"
    ports:
      - "5001:5001"
    networks:
      - packet-net
    depends_on:
      persistor-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; exit(0) if urllib.request.urlopen(\"http://localhost:5001/health\").read().decode() == \"OK\" else exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  analyzer-service:
    build: ./analyzer-service
    container_name: analyzer-service
    environment:
      SERVICE_PORT: 5003
      DATABASE_URL: "postgresql://packetuser:packetpass@db:5432/packetdb"
    ports:
      - "5003:5003"
    networks:
      - packet-net
    depends_on:
      parser-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; exit(0) if urllib.request.urlopen(\"http://localhost:5003/health\").read().decode() else exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  ui-service:
    build: ./ui-service
    container_name: ui-service
    environment:
      SERVICE_PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - packet-net
    depends_on:
      analyzer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; exit(0) if urllib.request.urlopen(\"http://localhost:5000\").read().decode() else exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s



volumes:
  db_data:

networks:
  packet-net:
    driver: bridge


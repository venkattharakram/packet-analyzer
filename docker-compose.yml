version: "3.8"

services:
  db:
    image: postgres:14
    container_name: packet-db
    restart: always
    environment:
      POSTGRES_DB: packetdb
      POSTGRES_USER: packetuser
      POSTGRES_PASSWORD: packetpass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - packet-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@packet.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin_config/servers:/pgadmin4/servers   # Auto-add servers.json
    depends_on:
      - db
    networks:
      - packet-net

  parser-service:
    build: ./parser-service
    container_name: parser-service
    ports:
      - "5001:5001"
    networks:
      - packet-net
    depends_on:
      - persistor-service

  persistor-service:
    build: ./persistor-service
    container_name: persistor-service
    ports:
      - "5002:5002"
    networks:
      - packet-net
    depends_on:
      - db

  analyzer-service:
    build: ./analyzer-service
    container_name: analyzer-service
    ports:
      - "5003:5003"
    networks:
      - packet-net
    depends_on:
      - parser-service

volumes:
  db_data:

networks:
  packet-net:
    driver: bridge

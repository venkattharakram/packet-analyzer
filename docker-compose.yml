version: "3.8"

services:
  db:
    image: postgres:14
    container_name: packet-db
    restart: always
    environment:
      POSTGRES_DB: packetdb
      POSTGRES_USER: packetuser
      POSTGRES_PASSWORD: packetpass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - packet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packetuser"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@packet.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_DB_HOST: db
      PGADMIN_DB_PORT: 5432
      PGADMIN_DB_NAME: packetdb
      PGADMIN_DB_USER: packetuser
      PGADMIN_DB_PASSWORD: packetpass
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin_config:/pgadmin4/servers
      - ./pgadmin_entrypoint.sh:/pgadmin4/entrypoint.sh
    entrypoint: ["/bin/sh", "/pgadmin4/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - packet-net

  parser-service:
    build: ./parser-service
    container_name: parser-service
    environment:
      SERVICE_PORT: 5001
      DATABASE_URL: "postgresql://packetuser:packetpass@db:5432/packetdb"
    ports:
      - "5001:5001"
    networks:
      - packet-net
    depends_on:
      persistor-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      retries: 5
      timeout: 5s

  persistor-service:
    build: ./persistor-service
    container_name: persistor-service
    environment:
      SERVICE_PORT: 5002
      DATABASE_URL: "postgresql://packetuser:packetpass@db:5432/packetdb"
    ports:
      - "5002:5002"
    networks:
      - packet-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 15s
      retries: 5
      timeout: 5s

  analyzer-service:
    build: ./analyzer-service
    container_name: analyzer-service
    environment:
      SERVICE_PORT: 5003
      DATABASE_URL: "postgresql://packetuser:packetpass@db:5432/packetdb"
    ports:
      - "5003:5003"
    networks:
      - packet-net
    depends_on:
      parser-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/health || exit 1"]
      interval: 15s
      retries: 5
      timeout: 5s

volumes:
  db_data:

networks:
  packet-net:
    driver: bridge
